<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2D6AF0">
  <title>You are offline | StayC</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F8F6F3; color: #111214; text-align: center; }
    .card { max-width: 420px; background: #fff; border: 1px solid #E6E1DB; border-radius: 16px; padding: 32px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.4rem; margin: 16px 0 8px; }
    p { color: #62666D; line-height: 1.5; }
    button { margin-top: 12px; background: #2D6AF0; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      body { background: #101113; color: #ECEDEF; }
      .card { background: #1B1D21; border-color: #2C2F35; }
      p { color: #A3A8B0; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/img/icons/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>StayC needs an internet connection to show listings and messages. Please check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
